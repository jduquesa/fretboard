version: "3.9"

services:
  pdf-api:
    build: ./pdf-api      # directory where Dockerfile + app.py live
    container_name: pdf-api
    restart: unless-stopped
    expose:
      - "8000"
    # If you want to reach it directly from outside (not only from nginx), add:
    ports:
      - "8000:8000"



  frontend:
    image: nginx:alpine
    container_name: pdf-frontend
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pdf-api

